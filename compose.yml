services:
  mcp-server-trello:
    container_name: mcp-server-trello
    build: .
    environment:
      TRELLO_API_KEY: ${TRELLO_API_KEY}
      TRELLO_TOKEN: ${TRELLO_TOKEN}
      # Opt in to Streamable HTTP (default is stdio). Bind 0.0.0.0 inside the
      # container and publish the port below. Set a bearer token before exposing
      # the server beyond a trusted network.
      # TRELLO_MCP_TRANSPORT: http
      # TRELLO_MCP_HTTP_HOST: 0.0.0.0
      # TRELLO_MCP_HTTP_PORT: 3000
      # TRELLO_MCP_HTTP_TOKEN: ${TRELLO_MCP_HTTP_TOKEN}
      # TRELLO_MCP_HTTP_ALLOWED_HOSTS: localhost:3000
      # Under HTTP the selection tools are hidden by default, since one shared
      # Trello client would let one session retarget another's calls. Set `on`
      # for a single-user deployment where that sharing is the point.
      # TRELLO_MCP_AMBIENT_SELECTION: 'on'
    # ports:
    #   - '3000:3000'
    restart: 'no'

